lists:
- name: New_Request
  kind: list
  purpose: TODO — describe what one row represents
  fields:
  - name: Title
    type: text
    section: Customer Info
    label_th: เลขที่คำขอ (RequestID)
    description: Auto-generated request reference, e.g. INVX888-1999.
    notes: Primary key; run number via Flow 1 + System_Config seed
    populated_by: user
  - name: CustomerName
    type: text
    section: Customer Info
    label_th: ชื่อลูกค้า
    description: Customer's full name.
    populated_by: user
  - name: CustomerType
    type: choice
    section: Customer Info
    label_th: ประเภทลูกค้า
    description: Individual or juristic person.
    choices:
    - บุคคลธรรมดา (Individual)
    - นิติบุคคล (Juristic)
    populated_by: user
  - name: CitizenID
    type: text
    section: Customer Info
    label_th: เลขบัตร/พาสปอร์ต
    description: National ID, Passport, or Juristic ID (13 digits for Thai ID).
    notes: 'Validated in-app: IsMatch ^\d{13}$ → varCardValid'
    populated_by: user
  - name: UID
    type: text
    section: Customer Info
    label_th: รหัสลูกค้า (UID)
    description: Unique customer identifier.
    notes: Key for Core Banking lookups
    populated_by: user
  - name: SourcePhone
    type: text
    section: Customer Info
    label_th: เบอร์โทร (ต้นทาง)
    description: Source phone of the confirmation call.
    populated_by: user
  - name: DestinationPhone
    type: text
    section: Customer Info
    label_th: เบอร์โทร (ปลายทาง)
    description: Destination phone of the confirmation call.
    populated_by: user
  - name: CallDate
    type: datetime
    section: Customer Info
    label_th: วันที่โทรยืนยัน
    description: Date of the recorded closure-confirmation call.
    notes: Sales-1 · Call recording box
    populated_by: user
  - name: CallTime
    type: text
    section: Customer Info
    label_th: เวลาโทรยืนยัน
    description: Time of the recorded call (hh:mm).
    notes: Sales-1 · Call recording box
    populated_by: user
  - name: CustomerEmail
    type: text
    section: Customer Info
    label_th: อีเมลลูกค้า
    description: Customer e-mail.
    populated_by: user
  - name: IsAlive
    type: bool
    section: Customer Info
    label_th: สถานะมีชีวิต
    description: False = deceased case → deceased document checklist.
    notes: Default = Yes
    populated_by: user
  - name: AccountNumberToClose
    type: text
    section: Account Details
    label_th: เลขบัญชีที่ต้องการปิด
    description: Main account number to close.
    populated_by: user
  - name: CloseEquityAccount
    type: bool
    section: Account Details
    label_th: ปิดบัญชีหุ้น
    description: Close the equity account?
    populated_by: user
  - name: CashAccountNumber
    type: text
    section: Account Details
    label_th: เลขบัญชี Cash
    description: Cash account number.
    populated_by: user
  - name: CashBalanceAccountNumber
    type: text
    section: Account Details
    label_th: เลขบัญชี Cash Balance
    description: Cash Balance / Prepaid account number.
    populated_by: user
  - name: CreditBalanceAccountNumber
    type: text
    section: Account Details
    label_th: เลขบัญชี Credit Balance
    description: Credit Balance account number.
    populated_by: user
  - name: CloseTFEXAccount
    type: bool
    section: Account Details
    label_th: ปิดบัญชี TFEX
    description: Close the TFEX account?
    populated_by: user
  - name: TFEXAccountNumber
    type: text
    section: Account Details
    label_th: เลขบัญชี TFEX
    description: TFEX account number.
    populated_by: user
  - name: CloseSBLAccount
    type: bool
    section: Account Details
    label_th: ปิดบัญชี SBL
    description: Close the SBL account?
    populated_by: user
  - name: SBLAccountNumber
    type: text
    section: Account Details
    label_th: เลขบัญชี SBL
    description: SBL account number.
    populated_by: user
  - name: CloseEBizService
    type: bool
    section: Account Details
    label_th: ปิดบริการ eBiz
    description: Close the eBiz service?
    populated_by: user
  - name: CloseDigitalAssetAccount
    type: bool
    section: Account Details
    label_th: ปิดบัญชี DA
    description: Close the Digital Asset account?
    populated_by: user
  - name: DigitalAssetAccountNumber
    type: text
    section: Account Details
    label_th: เลขบัญชี DA
    description: Digital Asset account number.
    populated_by: user
  - name: ClosePrivateFundAccount
    type: bool
    section: Account Details
    label_th: ปิดบัญชี Private Fund
    description: Close the private fund account?
    populated_by: user
  - name: PrivateFundAccountNumber
    type: text
    section: Account Details
    label_th: เลขบัญชี Private Fund
    description: Private fund account number.
    populated_by: user
  - name: CloseATSService
    type: bool
    section: Account Details
    label_th: ปิดบริการ ATS
    description: Close the ATS service?
    populated_by: user
  - name: ClosureReason
    type: choice
    section: Account Details
    label_th: สาเหตุการปิดบัญชี
    description: Why the account is being closed.
    choices:
    - เจ้าของบัญชีเสียชีวิต
    - ลูกค้าแจ้งความประสงค์
    - อื่นๆ โปรดระบุ
    populated_by: user
  - name: ClosureReasonOther
    type: text
    section: Account Details
    label_th: สาเหตุอื่น (ระบุ)
    description: Free text when reason = other.
    notes: Shown by varReasonOther (dropdown OnChange)
    populated_by: user
  - name: CloseScope
    type: choice
    section: Closure Decision
    label_th: ขอบเขตการปิด
    description: Close ALL account types or only SOME.
    choices:
    - ปิดทุกประเภทบัญชี
    - ปิดบางประเภทบัญชี
    populated_by: user
  - name: CloseScopeAccounts
    type: text
    section: Closure Decision
    label_th: บัญชีที่เลือกปิด
    description: Accounts to close when scope = Some (comma-separated).
    notes: Shown by varCloseSome…
    populated_by: user
  - name: UnitHolderDecision
    type: choice
    section: Closure Decision
    label_th: การปิดบัญชีกองทุน (unit holder)
    description: Mutual-fund closing decision — pick exactly one.
    choices:
    - 4 ตัวเลือก (ปิดได้/ปิดได้+Suspend/ปิดได้+Suspend หลายบัญชี/ปิดไม่ได้)
    populated_by: user
  - name: RelinquishDA
    type: choice
    section: Closure Decision
    label_th: ประสงค์สละสินทรัพย์ DA
    description: Customer's intent to relinquish DA assets.
    choices:
    - ยินยอม (Consent)
    - ไม่ยินยอม (Decline)
    populated_by: user
  - name: LitigationStatus
    type: choice
    section: Closure Decision
    label_th: ผลตรวจการฟ้องร้อง
    description: Auto litigation check result (written by Flow 2).
    choices:
    - Pending
    - Clean
    - Found
    populated_by: user
  - name: LitigationReason
    type: multiline
    section: Closure Decision
    label_th: สาเหตุการฟ้องร้อง
    description: Reason behind the litigation (when Found).
    populated_by: user
  - name: AOOpinion
    type: multiline
    section: Closure Decision
    label_th: ความเห็นเจ้าหน้าที่/บริษัท
    description: Marketing officer / company recommendation.
    notes: Sales-1 AO OPINION box
    populated_by: user
  - name: AORemark
    type: multiline
    section: Closure Decision
    label_th: AO Remark
    description: Free-text remark from the AO.
    notes: Sales-1 AO REMARK box
    populated_by: user
  - name: RefundMethod
    type: choice
    section: Transfer Info
    label_th: วิธีคืนเงิน
    description: How remaining money is refunded.
    choices:
    - โอนเข้าบัญชีธนาคาร
    - เช็ค
    - อื่นๆ
    populated_by: user
  - name: ReceivingBankName
    type: choice
    section: Transfer Info
    label_th: ธนาคารผู้รับ
    description: Receiving bank.
    choices:
    - รายชื่อธนาคาร
    populated_by: user
