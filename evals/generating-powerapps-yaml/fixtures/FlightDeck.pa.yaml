# ChopChop — FlightDeck screen  (v3 — border + brand CI pass)
#
# PASTE ORDER: LiveTracking.pa.yaml FIRST, then this file. The two screens Navigate() to
# each other, so whichever lands first has one dangling reference until the other arrives.
#
# ============================ BORDER TOKENS ============================
# Every stroke on this screen comes from one of these five values. Nothing is left to a
# Studio default — an unset BorderColor on Classic/Button falls back to the platform's
# blue, which is what produced the blue outlines on the tab buttons in v2.
#
#   RGBA(196, 114, 10, 1)   brand          — outline on the ACTIVE tab
#   RGBA(156, 91, 8, 1)     brand-dark     — outline on the filled primary button
#   RGBA(232, 199, 150, 1)  brand-tint-70  — outline on brand-adjacent controls (Order btn)
#   RGBA(200, 198, 196, 1)  neutral-60     — outline on secondary/ghost buttons
#   RGBA(225, 223, 221, 1)  neutral-40     — outline on INACTIVE tabs and small chips
#   RGBA(237, 235, 233, 1)  neutral-30     — card outlines and 1px divider rules
#
# ==================== v3 BORDER FIXES (all of them) ====================
#
#  A. BorderColor + BorderThickness are now set EXPLICITLY on all 5 Classic/Buttons.
#     Tab_FlightDeck, Tab_LiveTracking and Btn_StartOrder previously had neither, so
#     Studio drew its own blue focus-style border around them.
#
#  B. FocusedBorderThickness dropped from 2 to 1 on every button. A 2px focus ring on a
#     34px control inside a 34px row has nowhere to draw and bleeds over the neighbour.
#
#  C. A 1px border is drawn ON the control's own bounds, so a child whose Height equals
#     its parent's Height gets that border clipped by the parent edge. Every such pair is
#     now given slack:
#         Tabs_Row        34 -> 40   (buttons stay 34)
#         HeaderRight_Row 28 -> 34   (Avatar_Tile stays 28)
#         Hero_Actions_Row 40 -> 46  (buttons stay 40)
#     and the gallery cards inset to `=Parent.TemplateWidth - 8` so their left/right
#     borders sit inside the template rather than on its edge.
#
#  D. Power Apps has no per-side border. v2 used BorderThickness: =1 on AppBar, Footer_Row
#     and the fleet spec rows where the design wanted a single rule — which draws a full
#     box instead. Those are now explicit 1px divider GroupContainers filled with
#     neutral-30.
#
# ==================== v2 LAYOUT FIXES (still in force) ====================
#  1. Parent.Template* only resolves on a gallery's DIRECT child.
#  2. Bare `=Parent.Width` inside a padded parent overflows it by the padding.
#  3. AlignInContainer is required or a child stretches, ignoring its Width.
#  4. Every container Height >= sum(children) + gaps + padding.
#
# SUBSTITUTIONS: Icon.Publish stands in for the helicopter glyph (no such member in the
# confirmed 6-icon set); "★" is Label text; the progress marker is a two-segment bar.

Screens:
  FlightDeck:
    Properties:
      Fill: =RGBA(250, 249, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |
        =If(IsBlank(gblOrderRestaurant), Set(gblOrderRestaurant, "Nonna's Airstrip"));
        If(IsBlank(gblOrderItems), Set(gblOrderItems, "Margherita Pizza, Truffle Fries"));
        If(IsBlank(gblOrderTotal), Set(gblOrderTotal, "$28.50"));
        If(IsBlank(gblFlightNumber), Set(gblFlightNumber, "CC-1147"));
        If(IsBlank(gblOrderTimestamp), Set(gblOrderTimestamp, Now()));
        If(IsEmpty(colChecklist), ClearCollect(colChecklist,
          {Number: "1", Title: "Pick your plate", Body: "Browse the manifest and order from any kitchen on the network."},
          {Number: "2", Title: "We file the plan", Body: "Kitchen preps, pilot pre-flights, food loads into a thermal pod."},
          {Number: "3", Title: "Touchdown, your roof", Body: "We land on your building's pad, or the nearest cleared LZ."}));
        If(IsEmpty(colManifest), ClearCollect(colManifest,
          {Restaurant: "Nonna's Airstrip", Cuisine: "Italian", EtaText: "12 min", EtaFast: true, Rating: "4.9", Items: "Margherita Pizza, Truffle Fries", Total: "$28.50"},
          {Restaurant: "Wok This Way", Cuisine: "Pan-Asian", EtaText: "9 min", EtaFast: true, Rating: "4.7", Items: "Kung Pao Chicken, Spring Rolls", Total: "$22.00"},
          {Restaurant: "The Hangar Burger Co.", Cuisine: "American", EtaText: "16 min", EtaFast: false, Rating: "4.8", Items: "Double Stack, Onion Rings", Total: "$19.75"},
          {Restaurant: "Sushi Squadron", Cuisine: "Japanese", EtaText: "14 min", EtaFast: false, Rating: "5.0", Items: "Chef's Omakase, Miso Soup", Total: "$41.00"},
          {Restaurant: "Taco Tower", Cuisine: "Mexican", EtaText: "8 min", EtaFast: true, Rating: "4.6", Items: "Al Pastor x3, Elote", Total: "$16.25"},
          {Restaurant: "Curry Control Tower", Cuisine: "Thai", EtaText: "11 min", EtaFast: true, Rating: "4.9", Items: "Green Curry, Garlic Naan", Total: "$24.90"}));
        If(IsEmpty(colFleet), ClearCollect(colFleet,
          {Name: "The Featherweight", Body: "Solo orders, tight rooftops.", Spec1Label: "Payload", Spec1Value: "1 pod", Spec2Label: "Cruise speed", Spec2Value: "95 kt"},
          {Name: "The Workhorse", Body: "Group orders and office lunch runs.", Spec1Label: "Payload", Spec1Value: "6 pods", Spec2Label: "Cruise speed", Spec2Value: "140 kt"},
