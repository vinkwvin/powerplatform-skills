                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =28
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =28
                        Width: =200
                      Children:
                        - BrandMark_Tile:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(196, 114, 10, 1)
                              FillPortions: =0
                              Height: =28
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =28
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Width: =28
                            Children:
                              - BrandMark_Icon:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Height: =16
                                    Icon: =Icon.Publish  # UNVERIFIED approximation — no helicopter glyph in the confirmed 6-icon set
                                    Width: =16
                        - BrandWord_Label:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(32, 31, 30, 1)
                              FillPortions: =0
