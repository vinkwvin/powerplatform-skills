# ChopChop — LiveTracking screen  (v3 — border + brand CI pass)
#
# PASTE THIS FILE FIRST, then FlightDeck.pa.yaml.
#
# ============================ BORDER TOKENS ============================
#   RGBA(196, 114, 10, 1)   brand          — outline on the ACTIVE tab
#   RGBA(156, 91, 8, 1)     brand-dark     — outline on filled/selected controls
#   RGBA(200, 198, 196, 1)  neutral-60     — outline on secondary/ghost buttons
#   RGBA(225, 223, 221, 1)  neutral-40     — outline on INACTIVE tabs and unselected chips
#   RGBA(237, 235, 233, 1)  neutral-30     — card outlines and 1px divider rules
#
# ==================== v3 BORDER FIXES ====================
#  A. BorderColor + BorderThickness now set explicitly on all 7 Classic/Buttons.
#     Tab_FlightDeck and Tab_LiveTracking had neither, so Studio drew its default blue.
#     The four tip chips now switch BorderColor with their Fill, so a selected chip reads
#     as one solid brand shape instead of a brand fill inside a grey outline.
#  B. FocusedBorderThickness 2 -> 1 on every button.
#  C. Parents given slack so a 1px border is not clipped by an equal-height parent:
#         Tabs_Row        34 -> 40    HeaderRight_Row 28 -> 34
#         KPI_Row         70 -> 76    Chip_Row        34 -> 38
#  D. AppBar, Footer_Row and Order_Row_Total used BorderThickness where the design wanted
#     a single rule; Power Apps has no per-side border, so that drew a full box. They are
#     now 1px divider GroupContainers filled with neutral-30.
#
# ==================== STILL UNVERIFIED ====================
#  Real-time ticking. Values compute from `Now() - gblOrderTimestamp` against a 195-second
#  flight and are correct whenever the screen re-evaluates, but will not count down on
#  their own — `Timer` is not in the confirmed catalog. Test snippet at the bottom.

Screens:
  LiveTracking:
    Properties:
      Fill: =RGBA(250, 249, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |
        =If(IsBlank(gblOrderRestaurant), Set(gblOrderRestaurant, "Nonna's Airstrip"));
        If(IsBlank(gblOrderItems), Set(gblOrderItems, "Margherita Pizza, Truffle Fries"));
        If(IsBlank(gblOrderTotal), Set(gblOrderTotal, "$28.50"));
        If(IsBlank(gblFlightNumber), Set(gblFlightNumber, "CC-1147"));
        If(IsBlank(gblOrderTimestamp), Set(gblOrderTimestamp, Now()));
        UpdateContext({varSelectedTip: "+$4"});
        If(IsEmpty(colTimeline), ClearCollect(colTimeline,
          {Title: "Order confirmed", Threshold: 0, NextThreshold: 0.1},
          {Title: "Rotors spinning", Threshold: 0.1, NextThreshold: 0.25},
          {Title: "Airborne", Threshold: 0.25, NextThreshold: 0.8},
          {Title: "Final approach", Threshold: 0.8, NextThreshold: 1},
          {Title: "Landed", Threshold: 1, NextThreshold: 2}))
    Children:
      - LiveTracking_Root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            LayoutMinHeight: =700
            LayoutMinWidth: =1000
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - AppBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =52
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =52
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - Brand_Row:
